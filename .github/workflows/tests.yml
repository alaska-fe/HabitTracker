name: tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  core-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore tests
        run: dotnet restore HabitTracker.Tests/HabitTracker.Tests.csproj

      - name: Build Core
        run: dotnet build HabitTracker.Core/HabitTracker.Core.csproj --configuration Release --no-restore

      - name: Test with coverage
        run: |
          dotnet test HabitTracker.Tests/HabitTracker.Tests.csproj \
            --configuration Release \
            --no-restore \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=cobertura \
            /p:CoverletOutput="$GITHUB_WORKSPACE/TestResults/coverage/" \
            /p:Include="[HabitTracker.Core]*" \
            /p:ExcludeByAttribute=ExcludeFromCodeCoverage \
            /p:Threshold=80 \
            /p:ThresholdType=line \
            /p:ThresholdStat=total

      - name: Generate coverage report
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          "$HOME/.dotnet/tools/reportgenerator" \
            -reports:"$GITHUB_WORKSPACE/TestResults/coverage/coverage.cobertura.xml" \
            -targetdir:"$GITHUB_WORKSPACE/TestResults/coverage-report" \
            -reporttypes:"Html;TextSummary"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            TestResults/coverage-report
            TestResults/coverage/coverage.cobertura.xml
